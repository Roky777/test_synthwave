plugins {
    id "com.android.application"
}

android {
    namespace "com.presstoknow.willyoupress"
    compileSdk 36

    // Package the already-verified web production build without duplicating it in Android source.
    sourceSets.main.assets.srcDirs = ["../../dist"]

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.presstoknow.willyoupress"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
